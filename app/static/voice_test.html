<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语音功能测试</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f6f8;
    color: #333;
    padding: 24px;
    max-width: 760px;
    margin: 0 auto;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: #888; font-size: 13px; margin-bottom: 24px; }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .card h2 { font-size: 16px; margin-bottom: 12px; }
  textarea {
    width: 100%;
    height: 72px;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    resize: vertical;
    outline: none;
  }
  textarea:focus { border-color: #4a90d9; }
  .row { display: flex; gap: 10px; margin-top: 12px; align-items: center; }
  button {
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
    color: #fff;
    background: #4a90d9;
    transition: opacity .2s;
  }
  button:hover { opacity: .85; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.rec { background: #e05555; }
  button.stop { background: #666; }
  .status { font-size: 13px; color: #888; }
  .status.ok { color: #2a9d5c; }
  .status.err { color: #d9504a; }
  audio { width: 100%; margin-top: 12px; }
  .result {
    margin-top: 12px;
    padding: 12px;
    background: #f0f7f0;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
    display: none;
  }
  .hint { font-size: 12px; color: #aaa; margin-top: 10px; line-height: 1.6; }
</style>
</head>
<body>

<h1>🎙️ 语音功能测试</h1>
<div class="subtitle">TTS 文字转语音 / ASR 语音转文字 —— 由 FastAPI 直接托管，无需登录</div>

<!-- TTS -->
<div class="card">
  <h2>1️⃣ 文字转语音（TTS）</h2>
  <textarea id="ttsText" placeholder="输入要转成语音的文字，例如：你好，我是你的语音助手">你好，我是你的语音助手，欢迎使用语音对话功能</textarea>
  <div class="row">
    <button id="ttsBtn" onclick="doTTS()">🔊 整段合成播放（旧）</button>
    <button id="ttsStreamBtn" onclick="doTTSStream()">⚡ 流式播放（新）</button>
    <span id="ttsStatus" class="status"></span>
  </div>
  <audio id="ttsAudio" controls></audio>
  <div class="hint">两个按钮用同一段文字，可以对比出声速度：整段模式等全部合成完才返回；流式模式拿到第一块音频立刻开始播。</div>
</div>

<!-- ASR -->
<div class="card">
  <h2>2️⃣ 语音转文字（ASR）</h2>
  <div class="row">
    <button id="recBtn" onclick="startRec()">🎤 开始录音</button>
    <button id="stopBtn" onclick="stopRec()" disabled>⏹ 停止并识别</button>
    <span id="recStatus" class="status"></span>
  </div>
  <audio id="recAudio" controls style="display:none;"></audio>
  <div id="asrResult" class="result"></div>
  <div class="hint">
    提示：浏览器需要授权麦克风权限；录音格式为 webm（Chrome/Edge 实测可用），服务端 faster-whisper 支持自动解码。<br>
    也可以上传本地音频文件：
    <input type="file" id="fileInput" accept="audio/*" style="margin-left:4px;">
  </div>
</div>

<script>
const API = '';  // 同源，无需前缀

/* ---------- TTS：整段合成 ---------- */
async function doTTS() {
  const text = document.getElementById('ttsText').value.trim();
  const btn = document.getElementById('ttsBtn');
  const status = document.getElementById('ttsStatus');
  const audio = document.getElementById('ttsAudio');
  if (!text) { setStatus(status, 'err', '请输入文字'); return; }

  setStatus(status, '', '合成中…');
  btn.disabled = true;
  try {
    const resp = await fetch(API + '/api/voice/synthesize', {
      method: 'POST',
      body: new URLSearchParams({ text }),
    });
    if (!resp.ok) {
      const detail = await resp.json().catch(() => ({}));
      throw new Error(detail.detail || ('HTTP ' + resp.status));
    }
    const blob = await resp.blob();
    audio.src = URL.createObjectURL(blob);
    audio.play();
    setStatus(status, 'ok', '✅ 整段合成：等完全部才出声，总耗时 ' + (resp.headers.get('X-Elapsed-Ms') || '?') + 'ms');
  } catch (e) {
    setStatus(status, 'err', '❌ ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

/* ---------- TTS：流式播放 ---------- */
let ttsStreamStart = 0;

async function doTTSStream() {
  const text = document.getElementById('ttsText').value.trim();
  const btn = document.getElementById('ttsStreamBtn');
  const status = document.getElementById('ttsStatus');
  const audio = document.getElementById('ttsAudio');
  if (!text) { setStatus(status, 'err', '请输入文字'); return; }

  setStatus(status, '', '流式合成中…');
  btn.disabled = true;
  try {
    // 直接把 <audio> 指向流式接口，浏览器收到 mp3 块就渐进播放
    audio.src = API + '/api/voice/synthesize/stream?text=' + encodeURIComponent(text);
    ttsStreamStart = performance.now();
    await audio.play();   // play() 在真正开始出声后才 resolve，正好用来量首音延迟
    // 出声后再等服务端推完，把 TTFB 展示出来
    const ttfb = await fetch(API + '/api/voice/synthesize/stream?text=' + encodeURIComponent(text), { method: 'HEAD' })
      .then(r => r.headers.get('X-TTFB-Ms')).catch(() => null);
    setStatus(status, 'ok', '✅ 流式播放：出声等待 ' + Math.round(performance.now() - ttsStreamStart) + 'ms'
      + (ttfb ? '（服务端首块 ' + ttfb + 'ms）' : ''));
  } catch (e) {
    setStatus(status, 'err', '❌ ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

/* ---------- ASR：浏览器录音 ---------- */
let mediaRecorder = null;
let chunks = [];

async function startRec() {
  const recBtn = document.getElementById('recBtn');
  const stopBtn = document.getElementById('stopBtn');
  const status = document.getElementById('recStatus');
  const result = document.getElementById('asrResult');
  result.style.display = 'none';

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    chunks = [];
    mediaRecorder.ondataavailable = e => chunks.push(e.data);
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      document.getElementById('recAudio').src = URL.createObjectURL(blob);
      document.getElementById('recAudio').style.display = 'block';
      transcribe(blob);
    };
    mediaRecorder.start();
    recBtn.disabled = true;
    stopBtn.disabled = false;
    setStatus(status, '', '🔴 录音中… 对着麦克风说话，说完点「停止并识别」');
  } catch (e) {
    setStatus(status, 'err', '❌ 无法访问麦克风：' + e.message);
  }
}

function stopRec() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    document.getElementById('stopBtn').disabled = true;
    document.getElementById('recBtn').disabled = false;
    setStatus(document.getElementById('recStatus'), '', '识别中…');
    mediaRecorder.stop();
  }
}

/* ---------- ASR：上传音频文件 ---------- */
document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) {
    document.getElementById('asrResult').style.display = 'none';
    transcribe(file);
    e.target.value = '';
  }
});

/* ---------- 共用：调转写接口 ---------- */
async function transcribe(blob) {
  const status = document.getElementById('recStatus');
  const result = document.getElementById('asrResult');
  try {
    const form = new FormData();
    form.append('audio', blob, 'recording.webm');
    const resp = await fetch(API + '/api/voice/transcribe', { method: 'POST', body: form });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || ('HTTP ' + resp.status));
    result.textContent = '📝 识别结果：' + data.text + '\n⏱ 耗时：' + data.elapsed_ms + 'ms';
    result.style.display = 'block';
    setStatus(status, 'ok', '✅ 识别完成');
  } catch (e) {
    setStatus(status, 'err', '❌ ' + e.message);
  }
}

function setStatus(el, cls, msg) {
  el.className = 'status ' + (cls || '');
  el.textContent = msg;
}
</script>
</body>
</html>
